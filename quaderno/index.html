<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quaderno dei compiti</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;700&display=swap">
<style>
:root{--navy:#003366;--ink:#0A1D37;--line:#c9d1db;--soft:#f4f6f9;--soft2:#e9eef4;--mut:#5a6676;--ok:#1d7a46;--okbg:#e7f4ec;--acc:#F2B705;--red:#b3261e;--redbg:#fdecea;--page:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 Arial,"Liberation Sans",Helvetica,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.eyebrow{letter-spacing:.18em;font-size:12px;font-weight:bold;color:var(--navy);text-transform:uppercase}
.esci{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:13px}
h1{font-size:26px;margin:22px 0 4px;text-transform:uppercase}
.bar{width:96px;height:4px;background:var(--ink);margin:10px 0 16px}
.who{color:var(--mut)}.who b{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:bold;color:var(--navy)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--acc);color:var(--ink);font-size:12px}
label.f{display:block;font-size:13px;font-weight:bold;color:var(--navy);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
textarea.t{min-height:70px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.btn{border:0;background:var(--navy);color:#fff;font-weight:bold;padding:10px 16px;border-radius:6px;cursor:pointer}
.btn.big{width:100%;font-size:17px;padding:14px;border-radius:10px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.rosso{background:var(--red)}.btn.verde{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--mut)}
.msg{padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.no{background:var(--redbg);color:var(--red)}
.filtri{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.filtri select,.filtri input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
table.l{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.l th{text-align:left;background:var(--navy);color:#fff;padding:7px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
table.l td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.l tr.cl{cursor:pointer}table.l tr.cl:hover td{background:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.st{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:bold;white-space:nowrap}
.st.assegnato{background:#dfe9f5;color:var(--navy)}.st.consegnato{background:#FFF4CC;color:#6b5300}
.st.da_rifare{background:#ffe2cc;color:#8a3b00}.st.corretto{background:var(--okbg);color:var(--ok)}
.st.verificato{background:var(--ok);color:#fff}.st.segnalato{background:var(--red);color:#fff}
.st.storico{background:#e6e6e6;color:#444}
.mp-ed{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:14px;align-items:start}@media (max-width:760px){.mp-ed{grid-template-columns:1fr}.mp-svg{position:static;order:-1;max-height:55vh}}
.mp-svg{position:sticky;top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:78vh}.mp-svg svg{display:block}
.mp-r{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:8px;margin:8px 0;background:#fff}.mp-r input{margin:3px 0}
.mp-r .x{float:right}.mp-sub{margin-left:14px}.mp-form textarea.mpt{font-size:17px;line-height:1.4;resize:none;overflow:hidden;width:100%;min-height:40px;font-family:inherit}.mp-bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
@media print{header.top,.tabs,.mp-form,.mp-bar,.who,#esci{display:none!important}.mp-ed{display:block}.mp-svg{border:0;max-height:none}.mp-svg svg{width:100%!important;height:auto!important}}
.disp-m{margin:18px 0 6px;font-size:16px;color:var(--navy)}.disp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rit{color:var(--red);font-weight:bold}
.mat{font-size:12px;font-weight:bold;letter-spacing:.1em;color:var(--navy);text-transform:uppercase}
.comp h3{margin:4px 0 6px;font-size:17px}
.foto{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.foto figure{margin:0;position:relative}
.foto img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
.foto figcaption{font-size:12px;color:var(--mut)}
.foto .x{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;width:26px;height:26px;cursor:pointer}
label.cam{display:block;text-align:center;background:var(--ink);color:#fff;font-weight:bold;font-size:17px;padding:14px;border-radius:10px;cursor:pointer;margin-top:10px}
input[type=file].nasc{display:none}
.storia{list-style:none;padding:0;margin:8px 0 0}
.storia li{border-left:3px solid var(--line);padding:4px 0 8px 10px;font-size:14px}
.storia li b{color:var(--navy)}
.storia li.rosso{border-color:var(--red)}.storia li.verde{border-color:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(10,29,55,.55);display:none;z-index:10;overflow:auto;padding:16px}
#modal .box{background:#fff;max-width:860px;margin:0 auto;border-radius:10px;padding:16px;position:relative}
#modal .chiudi{position:absolute;top:10px;right:10px}
.edit{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px;margin-top:10px}
.edit canvas{display:block;max-width:100%;touch-action:none;margin:0 auto;background:#fff;cursor:crosshair}
.edit .tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff}
.chk label{font-size:14px;display:flex;gap:6px;align-items:flex-start}
.chk small{color:var(--mut)}
/* 22/11: compiti scritti sul quaderno: uno spazio per ogni esercizio, che si allunga con il testo (mai tagliato) */
.eser{border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:8px;padding:10px 12px;margin:12px 0;background:#fff}
.eser .num{font-size:12px;font-weight:bold;letter-spacing:.1em;color:var(--navy);text-transform:uppercase}
.eser .cons{white-space:pre-wrap;margin:4px 0 8px;font-size:16px}
textarea.risp{width:100%;min-height:96px;font-size:18px;line-height:1.5;padding:10px;border:2px solid var(--line);border-radius:8px;background:#fff;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
textarea.risp:focus{border-color:var(--navy);outline:3px solid #FFE60088}
.risp-ro{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);min-height:44px}
.tasti{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.tasti button{min-width:40px;height:40px;padding:0 6px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;font-size:19px;cursor:pointer}
.tasti button:active{background:var(--navy);color:#fff}
.salvo{font-size:13px;color:var(--mut);margin-top:4px}
.esiti{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.esiti button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:bold}
.esiti button.on.giusto{background:var(--ok);border-color:var(--ok);color:#fff}.esiti button.on.da_rivedere{background:#F2B705;border-color:#F2B705;color:var(--ink)}.esiti button.on.sbagliato{background:var(--red);border-color:var(--red);color:#fff}
textarea.notar{width:100%;min-height:44px;font-size:16px;line-height:1.4;padding:8px;border:2px solid #e8a39e;border-radius:8px;color:var(--red);resize:none;overflow:hidden}
.notar-ro{color:var(--red);font-weight:bold;white-space:pre-wrap;margin:6px 0 0}
.modo{display:flex;flex-wrap:wrap;gap:8px}.modo label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;cursor:pointer;font-weight:bold;color:var(--navy)}
/* 22/11: editor delle mappe a tutto schermo */
.mp-full{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column}
.mp-full .mp-bar{margin:0;padding:8px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);align-items:center;background:#fff}
.mp-body{flex:1;display:flex;min-height:0}
.mp-panel{width:min(440px,100%);flex:none;overflow:auto;border-right:1px solid var(--line);padding:4px 12px 40px;background:var(--soft)}
.mp-canvas{flex:1;overflow:auto;background:#fff;min-width:0}.mp-canvas svg{display:block;margin:0 auto}
@media (max-width:760px){.mp-panel{position:absolute;inset:auto 0 0 0;top:auto;height:55%;width:100%;border-right:0;border-top:2px solid var(--navy);z-index:2}}
.mp-form label.f{margin:8px 0 2px}.mp-r label.lab{display:block;font-size:12px;font-weight:bold;color:var(--mut);margin:6px 0 2px}
.mp-col{display:inline-flex;align-items:center;gap:6px}.mp-col i{display:inline-block;width:18px;height:14px;border-radius:4px;border:2px solid var(--b);background:var(--f)}
.mp-stampa,.mp-piede{display:none}
/* 22/11: in stampa / PDF la mappa esce come le mappe delle videolezioni: A4 orizzontale, logo, «MAPPA · materia», titolo, piè di pagina */
@page{size:A4 landscape;margin:11mm 14mm}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}#app>h1,#app>.bar,#app>.who,#app>.tabs,#app>.msg{display:none!important}.mp-full{position:static;display:block}.mp-panel,.mp-full .mp-bar,#aiuto{display:none!important}
 .mp-stampa{display:block;font-family:Figtree,Arial,sans-serif;color:#0B1530}.mp-stampa img{height:11mm;display:block}
 .mp-stampa .eb{margin-top:4mm;font:700 9pt Figtree,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#2060AF}
 .mp-stampa h2{margin:1mm 0 0;font:800 24pt/1.1 "Bricolage Grotesque",Arial,sans-serif;color:#0B1530;text-transform:none}
 .mp-stampa .lin{width:16mm;height:1.2mm;background:#2060AF;margin:2.5mm 0 3mm}
 .mp-body{display:block}.mp-canvas{overflow:visible;height:auto!important}.mp-canvas svg{display:block;width:100%!important;height:auto!important;max-height:135mm;margin:0 auto}
 .mp-piede{display:flex;justify-content:space-between;border-top:.3mm solid #c9d1db;margin-top:3mm;padding-top:2mm;font:700 8pt Figtree,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#2060AF}}
.vuoto{color:var(--mut);padding:18px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:8px}
.codice{font:bold 20px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--soft2);padding:8px 12px;border-radius:6px;display:inline-block}
@media (max-width:640px){h1{font-size:21px}table.l .mob-no{display:none}}
#aiuto{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:9;background:#FFE600;color:#0a1d37;border:2px solid #0a1d37;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.aiu{border-left:4px solid #C2410C}.aiu.ok{border-left-color:#15803D}.mp-sync{font-size:13px;color:#555}
</style>
<meta name="versione" content="2026-11-12c">
<script>/* se GitHub ha una versione più nuova di questa pagina, la carica subito (niente più «non vedo le novità») */
(function(){try{var mia=document.querySelector('meta[name=versione]').content;
fetch(location.pathname,{cache:'reload'}).then(function(r){return r.text()}).then(function(t){var m=t.match(/name="versione" content="([^"]+)"/);
if(m&&m[1]!==mia){var k='aggiornata_'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}location.reload()}}).catch(function(){})}catch(e){}})();</script>

<body>
<header class="top"><div class="wrap"><span class="eyebrow">Centro Studi Telesio · Quaderno dei compiti</span><button class="esci" id="esci" hidden>Esci</button></div></header>
<main class="wrap" id="app"></main>
<button id="aiuto" hidden>? Chiedi aiuto</button>
<div id="modal"><div class="box"><button class="btn sec chiudi" id="mchiudi">Chiudi</button><div id="mbody"></div></div></div>
<script>
const API='https://tsguzxawpywxrydazhrc.supabase.co/functions/v1/quaderno';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATI={assegnato:'Da consegnare',consegnato:'Da correggere',da_rifare:'Da rifare',corretto:'Corretto',verificato:'Verificato',segnalato:'Segnalato',storico:'Storico'};
const dl=s=>s?new Date(s).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}):'';
const dlo=s=>s?new Date(s).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const loc=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dd=s=>s?new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}):'';
let ALTAB='compiti',DISPENSE=null;
let CODICE='',IO=null,COMPITI=[],ALUNNI=[],NOMI={},TAB='',F={alunno:'',materia:'',stato:'',cerca:''};

async function api(azione,dati={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codice:CODICE,azione,...dati})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.errore||('errore '+r.status));
  return j;
}
async function carica(blob,mime,compito_id){
  const u=await api('carica',{mime,compito_id});
  const r=await fetch(u.url,{method:'PUT',headers:{'Content-Type':mime},body:blob});
  if(!r.ok)throw new Error('caricamento non riuscito ('+r.status+')');
  return u.path;
}
const URLS={};
async function vedi(path){if(URLS[path])return URLS[path];const u=(await api('vedi',{path})).url;URLS[path]=u;setTimeout(()=>delete URLS[path],50*60e3);return u}
async function riduci(file){
  if(file.type==='application/pdf')return {blob:file,mime:'application/pdf'};
  const img=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.72)),mime:'image/jpeg'};
}
function ricorda(c){try{if(c)localStorage.setItem('quaderno_codice',c);else localStorage.removeItem('quaderno_codice')}catch(e){}}
function ricordato(){try{return localStorage.getItem('quaderno_codice')||''}catch(e){return ''}}

/* ---------------- accesso ---------------- */
function schermataAccesso(err){
  $('#esci').hidden=true;
  $('#app').innerHTML=`<h1>Quaderno dei compiti</h1><div class="bar"></div>
  <div class="card" style="max-width:460px">
    <label class="f" for="cod">Il tuo codice</label>
    <input class="t" id="cod" autocomplete="off" autocapitalize="characters" placeholder="Scrivi il codice che ti ha dato la scuola">
    <label style="display:flex;gap:6px;margin-top:10px;font-size:14px"><input type="checkbox" id="ric"> Ricorda il codice su questo dispositivo</label>
    <button class="btn big" id="entra" style="margin-top:12px">Entra</button>
    ${err?`<div class="msg no">${esc(err)}</div>`:''}
    <p class="note">Alunni: il modo più semplice è inquadrare con il telefono il codice QR che trovi nel tuo registro.</p>
  </div>`;
  const go=()=>entra($('#cod').value.trim(),$('#ric').checked);
  $('#entra').onclick=go;$('#cod').onkeydown=e=>{if(e.key==='Enter')go()};$('#cod').focus();
}
/* 18/11: codici del PDF «Codici di accesso degli alunni» (14/11) → codice vero (stessi file alias del registro) */
async function codiceDalPdf(c){try{const E=new TextEncoder(),C=String(c||'').trim().toUpperCase().replace(/\s+/g,'');
  const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',E.encode('alias|'+C)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const r=await fetch('../registro-compiti/alias/'+h.slice(0,16)+'.enc?t='+Date.now());if(!r.ok)return null;
  const k=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',E.encode('telesio-alias|'+C)),'AES-GCM',false,['decrypt']);
  const u=Uint8Array.from(atob((await r.text()).trim()),x=>x.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12)))).c||null}catch(e){return null}}
async function entra(c,salva){
  if(!c)return;CODICE=c;
  $('#app').innerHTML='<div class="vuoto" style="margin-top:30px">Accesso in corso…</div>';
  try{IO=await api('accesso')}catch(e){CODICE='';ricorda('');if(e.message==='Codice non valido'){const v=await codiceDalPdf(c);if(v&&v!==c)return entra(v,salva)}return schermataAccesso(e.message==='Codice non valido'?'Codice non valido. Controlla di averlo scritto bene.':'Non riesco a collegarmi: '+e.message)}
  if(salva)ricorda(c);
  $('#esci').hidden=false;$('#aiuto').hidden=IO.tipo==='staff';
  if(IO.tipo==='alunno'){await caricaCompiti();return vistaAlunno()}
  TAB='correggere';
  await Promise.all([caricaCompiti(),api('alunni').then(r=>ALUNNI=r.alunni),api('nomi').then(r=>r.persone.forEach(p=>NOMI[p.id]=p.nome))]);
  if(STAFF())try{AIUTI_APERTE=(await api('aiuti')).aiuti.filter(x=>x.stato==='aperta').length}catch(e){}
  vistaScuola();
}
$('#esci').onclick=()=>{ricorda('');CODICE='';IO=null;COMPITI=[];$('#aiuto').hidden=true;clearInterval(MSYNC);schermataAccesso()};
async function caricaCompiti(){COMPITI=(await api('lista')).compiti}

/* ---------------- vista alunno (telefono) ---------------- */
const SCELTE={};// compito_id -> [{blob,url}]
function tabAlunno(){return `<div class="tabs"><button data-atab="compiti" class="${ALTAB==='compiti'?'on':''}">I miei compiti</button><button data-atab="dispense" class="${ALTAB==='dispense'?'on':''}">Dispense di studio</button><button data-atab="mappe" class="${ALTAB==='mappe'?'on':''}">Mappe</button></div>`}
function collegaTabAlunno(){document.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{ALTAB=b.dataset.atab;vistaAlunno()})}
function vistaAlunno(msg,V){if(!V&&ALTAB==='mappe'){$('#app').innerHTML=`<h1>Mappe</h1><div class="bar"></div><div class="who"><b>${esc(IO.nome)}</b></div>${tabAlunno()}<div id="mpp"></div>`;collegaTabAlunno();return vistaMappe('#mpp')}
  if(!V&&ALTAB==='dispense'){$('#app').innerHTML=`<h1>Dispense di studio</h1><div class="bar"></div><div class="who"><b>${esc(IO.nome)}</b></div>${tabAlunno()}<div id="dsp"></div>`;collegaTabAlunno();return vistaDispense('#dsp')}
  V=V||{lista:COMPITI,nome:IO.nome,ro:false,dove:'#app'};const L=V.lista;
  const daFare=L.filter(c=>c.stato==='assegnato'||c.stato==='da_rifare').sort((a,b)=>(a.scadenza||'9').localeCompare(b.scadenza||'9'));
  const attesa=L.filter(c=>c.stato==='consegnato');
  const fatti=L.filter(c=>['corretto','verificato','segnalato'].includes(c.stato));

/* penna rossa sulla foto */
let CORR=[];
function editor(path,src){
  const box=$('#editor');box.innerHTML=`<div class="edit"><div class="tools"><button class="btn sec" id="eu">Annulla l'ultimo segno</button><button class="btn sec" id="ep">Penna: sottile</button><button class="btn" id="es">Tieni questa pagina corretta</button><button class="btn sec" id="ex">Chiudi senza tenere</button></div><canvas id="cv2"></canvas></div>`;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{const cv=$('#cv2'),k=Math.min(1,1600/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const g=cv.getContext('2d');
    const tratti=[];let cur=null,spess=4;
    const disegna=()=>{g.drawImage(img,0,0,cv.width,cv.height);g.strokeStyle='#e00000';g.lineCap=g.lineJoin='round';tratti.forEach(t=>{g.lineWidth=t.w;g.beginPath();t.p.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()})};
    const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
    cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur={w:spess*cv.width/800,p:[pos(e)]};tratti.push(cur)};
    cv.onpointermove=e=>{if(cur){cur.p.push(pos(e));disegna()}};cv.onpointerup=cv.onpointercancel=()=>{cur=null};
    $('#eu').onclick=()=>{tratti.pop();disegna()};
    $('#ep').onclick=()=>{spess=spess===4?9:4;$('#ep').textContent='Penna: '+(spess===4?'sottile':'grossa')};
    $('#es').onclick=()=>cv.toBlob(b=>{CORR.push(b);box.innerHTML='';mostraCorrette()},'image/jpeg',.8);
    $('#ex').onclick=()=>box.innerHTML='';disegna();box.scrollIntoView({behavior:'smooth'})};
  img.onerror=()=>{box.innerHTML='<div class="msg no">Non riesco ad aprire la foto per segnarla. Puoi comunque scrivere voto e commento.</div>'};
  img.src=src;
}
function mostraCorrette(){$('#corrette').innerHTML=CORR.map((b,i)=>`<figure><img src="${URL.createObjectURL(b)}" alt="Pagina corretta ${i+1}"><figcaption>Corretta ${i+1}</figcaption><button class="x" data-tc="${i}">×</button></figure>`).join('');

function svgMappa(d,z){
  /* 17/11 sera (alunni BES): carattere grande e fisso, i riquadri crescono con il testo, nessuna sovrapposizione, la mappa si allarga da sola */
  const R=d.rami||[],n=Math.max(R.length,1);
  const wrap=(t,m)=>{const w=String(t||'').split(/\s+/).filter(Boolean);const o=[];let c='';w.forEach(x=>{while(x.length>m){if(c){o.push(c);c=''}o.push(x.slice(0,m));x=x.slice(m)}if((c+' '+x).trim().length>m){if(c)o.push(c);c=x}else c=(c+' '+x).trim()});if(c)o.push(c);return o.length?o:['']};
  const linee=(t,bw,sz)=>wrap(t,Math.max(6,Math.floor(bw/(sz*0.6))));
  const txt=(x,y,L,sz,col,b)=>L.map((r,i,a)=>`<text x="${x}" y="${y+(i-(a.length-1)/2)*sz*1.25}" text-anchor="middle" dominant-baseline="middle" font-size="${sz}" font-family="Verdana,Arial" ${b?'font-weight="bold"':''} fill="${col}">${esc(r)}</text>`).join('');
  const SW=240,SF=20,BW=290,BT=24,BK=19,BE=18,CW=280,CF=30,GAP=16;
  const Lc=linee(d.centro||'Argomento',CW,CF),ry=Math.max(62,Lc.length*CF*1.25/2+30),rx=Math.max(150,CW/2+40);
  const urta=(A,B)=>A[0]<B[2]&&B[0]<A[2]&&A[1]<B[3]&&B[1]<A[3];
  const fatti=[[-rx-20,-ry-20,rx+20,ry+20]];let g='',sotto='';
  R.forEach((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,K=catRamo(r.c),c=K.b;
    const Lt=linee(r.t||'',BW-24,BT),Lk=r.k?linee('🔑 '+r.k,BW-24,BK):[],Le=r.e?linee('es. '+r.e,BW-24,BE):[];
    const hT=Lt.length*BT*1.25,hK=Lk.length*BK*1.25,hE=Le.length*BE*1.25,bh=hT+hK+hE+28+(Lk.length?6:0)+(Le.length?6:0);
    const lato=Math.cos(a)>=-0.2?1:-1,F=(r.f||[]).map(s=>{const L=linee(s.t||'',SW-20,SF);return {L,h:L.length*SF*1.25+20}});
    const Hs=F.reduce((t,x)=>t+x.h,0)+GAP*Math.max(0,F.length-1);let yc=-Hs/2;F.forEach(x=>{x.dx=lato*(BW/2+50+SW/2);x.dy=yc+x.h/2;yc+=x.h+GAP});
    const rel=[[-BW/2,-bh/2,BW/2,bh/2]].concat(F.map(x=>[x.dx-SW/2,x.dy-x.h/2,x.dx+SW/2,x.dy+x.h/2]));
    const gb=[Math.min(...rel.map(q=>q[0])),Math.min(...rel.map(q=>q[1])),Math.max(...rel.map(q=>q[2])),Math.max(...rel.map(q=>q[3]))];
    let rad=200,x=0,y=0;for(let k=0;k<200;k++){x=rad*Math.cos(a);y=rad*0.82*Math.sin(a);const B=[gb[0]+x-12,gb[1]+y-12,gb[2]+x+12,gb[3]+y+12];if(!fatti.some(A=>urta(A,B))){fatti.push(B);break}rad+=15}
    g+=`<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="#0B1530" stroke-width="4"/>`;
    F.forEach(s=>{const sx=x+s.dx,sy=y+s.dy;g+=`<line x1="${x}" y1="${y}" x2="${sx}" y2="${sy}" stroke="#0B1530" stroke-width="2.5"/>`;
      sotto+=`<rect x="${sx-SW/2}" y="${sy-s.h/2}" width="${SW}" height="${s.h}" rx="10" fill="${K.f}" stroke="${c}" stroke-width="2.5"/>`+txt(sx,sy,s.L,SF,'#0B1530')});
    let yy=y-bh/2+14;sotto+=`<rect x="${x-BW/2}" y="${y-bh/2}" width="${BW}" height="${bh}" rx="14" fill="${K.f}" stroke="${c}" stroke-width="4"/>`;
    sotto+=txt(x,yy+hT/2,Lt,BT,'#0B1530',1);yy+=hT+6;if(Lk.length){sotto+=txt(x,yy+hK/2,Lk,BK,'#0B1530');yy+=hK+6}if(Le.length)sotto+=txt(x,yy+hE/2,Le,BE,'#0B1530')});
  g+=sotto+`<ellipse cx="0" cy="0" rx="${rx}" ry="${ry}" fill="${BES[0].f}" stroke="${BES[0].b}" stroke-width="5"/>`+txt(0,0,Lc,CF,'#0B1530',1);
  let x0=Math.min(...fatti.map(q=>q[0]))-20,y0=Math.min(...fatti.map(q=>q[1]))-20,W=Math.max(...fatti.map(q=>q[2]))+20-x0,H=Math.max(...fatti.map(q=>q[3]))+20-y0;
  W+=280;y0-=60;H+=60;  /* spazio per la legenda in alto a destra, così non copre mai la mappa */
  const usati=[0,...new Set(R.map(r=>1+((+r.c||0)%4+4)%4))].sort(),LW=250,LH=34+usati.length*30,lx=x0+W-LW-10,ly=y0+10;
  const leg=`<g aria-label="Legenda"><rect x="${lx}" y="${ly}" width="${LW}" height="${LH}" rx="10" fill="#fff" stroke="#c9d1db"/><text x="${lx+14}" y="${ly+24}" font-size="17" font-weight="bold" font-family="Verdana,Arial" fill="#0B1530">Legenda</text>`+usati.map((k,i)=>`<rect x="${lx+14}" y="${ly+38+i*30}" width="26" height="20" rx="5" fill="${BES[k].f}" stroke="${BES[k].b}" stroke-width="2.5"/><text x="${lx+50}" y="${ly+53+i*30}" font-size="16" font-family="Verdana,Arial" fill="#0B1530">${BES[k].n}</text>`).join('')+'</g>';
  g+=leg;
  return `<svg viewBox="${x0} ${y0} ${W} ${H}" width="${Math.round(W*z)}" height="${Math.round(H*z)}" style="max-width:none" role="img" aria-label="Mappa: ${esc(d.centro||'')}">${g}</svg>`;
}
function editorMappa(m,dove,alunno){MAPPA=m;MZOOM=1;clearInterval(MSYNC);
  const form=()=>{const d=MAPPA.dati;return `<div class="mp-form"><label class="f">Argomento (al centro)</label><textarea class="t mpt" rows="1" data-k="centro">${esc(d.centro)}</textarea>
   ${d.rami.map((r,i)=>{const K=catRamo(r.c);return `<div class="mp-r" style="--c:${K.b}"><button class="esci x" data-rx="${i}">togli</button>
    <label class="f">Ramo ${i+1}</label><label class="lab">Concetto</label><textarea class="t mpt" rows="1" data-r="${i}" data-k="t">${esc(r.t)}</textarea>
    <label class="lab">Parola chiave</label><textarea class="t mpt" rows="1" data-r="${i}" data-k="k">${esc(r.k)}</textarea><label class="lab">Esempio</label><textarea class="t mpt" rows="1" data-r="${i}" data-k="e">${esc(r.e)}</textarea>
    <div class="mp-sub">${(r.f||[]).map((s,j)=>`<label class="lab">Dettaglio ${j+1}</label><div style="display:flex;gap:4px"><textarea class="t mpt" rows="1" data-r="${i}" data-s="${j}">${esc(s.t)}</textarea><button class="esci" data-sx="${i}.${j}" aria-label="Togli il dettaglio">×</button></div>`).join('')}
    <button class="esci" data-sa="${i}">+ dettaglio</button> <button class="esci mp-col" data-col="${i}" style="--f:${K.f};--b:${K.b}"><i></i>Colore: ${K.n}</button></div></div>`}).join('')}
   <button class="btn sec" id="mpra">+ ramo</button></div>`};

    v.innerHTML=svgMappa(MAPPA.dati,z)};
  const salva=()=>{MTOCCO=Date.now();clearTimeout(MTIMER);$('#mps').textContent='Salvataggio…';MTIMER=setTimeout(async()=>{MTIMER=null;try{const r=await api('mappa_salva',{id:MAPPA.id,materia:MAPPA.materia,titolo:MAPPA.dati.centro||MAPPA.titolo,dati:MAPPA.dati});MAPPA.aggiornata=r.aggiornata||MAPPA.aggiornata;$('#mps').textContent='Salvata ✓'}catch(e){$('#mps').textContent='Non salvata: '+e.message}},1200)};

      if(MTIMER||Date.now()-MTOCCO<4000)return;if(JSON.stringify(x.dati)===JSON.stringify(MAPPA.dati)){MAPPA.aggiornata=x.aggiornata;return}const fo=document.activeElement;if(fo&&fo.closest&&fo.closest('.mp-form'))return;/* 17/11: mai mentre si scrive */MAPPA.dati=x.dati;MAPPA.aggiornata=x.aggiornata;tutto();

    $('#mpra').onclick=()=>{d.rami.push({t:'',k:'',e:'',c:d.rami.length,f:[]});tutto();salva()};
    document.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{d.rami.splice(+b.dataset.rx,1);tutto();salva()});
    document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{d.rami[b.dataset.sa].f.push({t:''});tutto();salva()});
    document.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.sx.split('.');d.rami[i].f.splice(j,1);tutto();salva()});
    document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{d.rami[b.dataset.col].c++;tutto();salva()})};
  tutto();
}

  if(c){history.replaceState(null,'',location.pathname+location.search);return entra(c,true)}
  const r=ricordato();if(r)return entra(r,false);schermataAccesso()})();
</script>
