<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Bricolage;font-weight:800;src:url(BricolageGrotesque-ExtraBold.ttf)}
@font-face{font-family:Figtree;font-weight:400;src:url(Figtree-Regular.ttf)}
@font-face{font-family:Figtree;font-weight:700;src:url(Figtree-Bold.ttf)}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;background:#fff;position:relative;overflow:hidden;font-family:Figtree;color:#0B1530}
.logo{position:absolute;left:80px;top:48px;height:58px}
.hr{position:absolute;left:80px;right:80px;height:1px;background:#E3E7EE}
.k{position:absolute;left:80px;top:146px;font:700 22px 'Figtree';letter-spacing:.12em;color:#2060AF;text-transform:uppercase}
h1{position:absolute;left:80px;top:215px;width:1280px;font:800 64px/1.05 Bricolage;letter-spacing:-.01em}
.bar{position:absolute;left:80px;width:85px;height:6px;background:#2060AF;border-radius:3px}
.card{position:absolute;left:80px;width:1305px;background:#fff;border-radius:22px;box-shadow:0 8px 34px rgba(11,21,48,.12);border:1px solid #E3E7EE;overflow:hidden}
.row{padding:20px 28px;font-size:31px;line-height:1.3;border-bottom:1px solid #E3E7EE;color:#8993a8}
.row b{font-weight:700}.row.on{background:#FFF9B8;color:#0B1530}.row.done{color:#0B1530}
.row.on b,.row.done b{color:#2060AF}
.foot{position:absolute;left:80px;right:80px;bottom:44px;display:flex;justify-content:space-between;font:700 21px 'Figtree';letter-spacing:.1em;color:#2060AF}
.foot:before{content:"";position:absolute;left:0;right:0;top:-24px;height:1px;background:#E3E7EE}
.prof{position:absolute;left:1428px;top:148px;width:412px;height:309px;border-radius:20px;background:#ccd;box-shadow:0 10px 36px rgba(11,21,48,.22);overflow:hidden}
.name{position:absolute;left:1430px;top:476px;width:412px;height:96px;background:#FFE600;border-radius:8px;transform:rotate(-3deg);box-shadow:0 8px 22px rgba(11,21,48,.2);padding:14px 22px}
.name b{display:block;font:800 31px Bricolage}.name i{display:block;font:700 19px Figtree;font-style:normal;margin-top:4px;letter-spacing:.02em}
</style>
<img class=logo src="logo.svg">
<div class=hr style="top:124px"></div>
<div class=k id=k></div><h1 id=t></h1><div class=bar id=bar></div>
<div class=card id=card></div>
<div class=prof></div><div class=name><b>Giorgio Mazzotti</b><i>PROF. DI STORIA</i></div>
<div class=foot><span>STORIA V · Prof. Giorgio Mazzotti</span><span id=pg></span></div>
