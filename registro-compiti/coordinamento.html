<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro compiti · Coordinamento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1530;--bg:#F3F5F9;--line:#D9DEE8;--txt:#14203A;--mut:#5B6478;--acc:#2B4BFF;--yel:#FFC21A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:16px}header span{font-size:13px;opacity:.8}header button{margin-left:auto}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:600 14px Inter,sans-serif;cursor:pointer;color:var(--txt)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
#main{height:100%}#app{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 52px)}
#side{border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
#q{margin:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:15px Inter,sans-serif}
#list{overflow:auto;flex:1}
.it{padding:10px 14px;border-top:1px solid #EEF1F6;cursor:pointer}
.it:hover{background:#F6F8FD}.it.on{background:#E8EDFF;border-left:4px solid var(--acc);padding-left:10px}
.it b{display:block;font-size:14px}.it small{color:var(--mut);font-size:12px}
#frame{display:flex;flex-direction:column;min-height:0}.vb{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff;font-size:13px;color:var(--mut)}.vb .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
iframe{width:100%;flex:1;border:0;background:var(--bg)}
#vuoto{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);padding:24px;text-align:center}
#login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
#login h1{font-size:20px;margin:0 0 8px;color:var(--navy)}#login p{color:var(--mut);font-size:14px;margin:0 0 16px}
#pin{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:600 18px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
#err{color:#b3261e;font-size:14px;min-height:20px}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:40% 60%}#side{border-right:0;border-bottom:1px solid var(--line)}}
</style><meta name="versione" content="2026-11-11a">
<script>/* se GitHub ha una versione più nuova di questa pagina, la carica subito (niente più «non vedo le novità») */
(function(){try{var mia=document.querySelector('meta[name=versione]').content;
fetch(location.pathname,{cache:'reload'}).then(function(r){return r.text()}).then(function(t){var m=t.match(/name="versione" content="([^"]+)"/);
if(m&&m[1]!==mia){var k='aggiornata_'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}location.reload()}}).catch(function(){})}catch(e){}})();</script>
</head><body>
<div id="login"><h1>Registro compiti · Coordinamento</h1><p>Scrivi il tuo codice personale. Questo computer lo ricorderà.</p>
<input id="pin" autocomplete="off" placeholder="CODICE"><button class="btn pri" id="ok" style="width:100%">Entra</button><div id="err"></div></div>
<div id="main" style="display:none">
<header><b>Registro compiti · Coordinamento</b><span id="chi"></span><a class="btn" href="https://zagavre-ai.github.io/Lezioni/quaderno/" target="_blank" rel="noopener" style="text-decoration:none;margin-left:auto">Quaderno dei compiti ↗</a><button class="btn" id="esci" style="margin-left:0">Esci</button></header>
<div id="app"><div id="side"><input id="q" placeholder="Cerca alunno o indirizzo…"><div id="list"></div></div>
<div id="frame"><div id="vuoto">Scegli un alunno dall'elenco a sinistra:<br>si apre il suo registro, già in modalità docente.</div></div></div></div>
<script>
const enc=new TextEncoder(),dec=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async t=>hex(await crypto.subtle.digest('SHA-256',enc.encode(t)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=[],SEL='',VISTA='docente';
async function apri(pin){
  const f=(await sha('telesio-elenco-file|'+pin)).slice(0,16);
  const r=await fetch('elenco_'+f+'.enc?t='+Date.now());if(!r.ok)throw 'codice';
  const k=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',enc.encode('telesio-elenco|'+pin)),'AES-GCM',false,['decrypt']);
  const u=unb64((await r.text()).trim());const o=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))));
  try{localStorage.setItem('telesio_pin',pin)}catch(e){}
  L=o.registri;$('#chi').textContent=o.nome+' · '+L.length+' registri';$('#login').style.display='none';$('#main').style.display='';lista();
}
function lista(){const q=$('#q').value.toLowerCase();
  $('#list').innerHTML=L.filter(s=>(s.nome+' '+s.indirizzo).toLowerCase().includes(q)).map(s=>'<div class="it'+(s.codice===SEL?' on':'')+'" data-c="'+s.codice+'"><b>'+esc(s.nome)+'</b><small>'+esc(s.indirizzo)+'</small></div>').join('')||'<div class="it"><small>Nessun alunno trovato</small></div>';
  document.querySelectorAll('.it[data-c]').forEach(d=>d.onclick=()=>{SEL=d.dataset.c;const s=L.find(x=>x.codice===SEL);
    mostra();lista()})}
function mostra(){const s=L.find(x=>x.codice===SEL);if(!s)return;
  $('#frame').innerHTML='<div class="vb"><button class="btn'+(VISTA==='docente'?' on':'')+'" data-v="docente">Vista docente</button><button class="btn'+(VISTA==='studente'?' on':'')+'" data-v="studente">Vista studente</button><span>'+(VISTA==='studente'?'Vedi esattamente quello che vede l’alunno, fino a oggi. Sola lettura.':'Puoi scrivere in tutte le materie.')+'</span></div>'+
  '<iframe src="index.html?c='+encodeURIComponent(s.codice)+'&n='+encodeURIComponent(s.nome)+'&i='+encodeURIComponent(s.indirizzo)+(VISTA==='studente'?'&vista=studente':'&ruolo=docente')+'"></iframe>';
  document.querySelectorAll('.vb [data-v]').forEach(b=>b.onclick=()=>{VISTA=b.dataset.v;mostra()})}
$('#q').oninput=lista;
const go=()=>{const p=$('#pin').value.trim().toUpperCase();if(!p)return;$('#err').textContent='Controllo…';apri(p).catch(()=>{$('#err').textContent='Codice non valido.'})};
$('#ok').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
$('#esci').onclick=()=>{try{localStorage.removeItem('telesio_pin')}catch(e){}location.reload()};
let P='';try{P=localStorage.getItem('telesio_pin')||''}catch(e){}if(P)apri(P).catch(()=>{});
</script></body></html>
