<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro dei compiti</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#003366;--ink:#0A1D37;--line:#c9d1db;--soft:#f4f6f9;--soft2:#e9eef4;--mut:#5a6676;--ok:#1d7a46;--acc:#F2B705;--bg:#ffffff;--page:#eef1f5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.4 Arial,"Liberation Sans",Helvetica,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}
.demo{background:#FFF4CC;border-bottom:1px solid #E8D48A;font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-top:8px;padding-bottom:8px}
.demo b{color:#6b5300}
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--navy);padding:5px 12px;cursor:pointer;font-weight:bold;font-size:13px}
.seg button.on{background:var(--navy);color:#fff}
.lnk{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:12px;gap:12px}
header.top img{height:34px;display:block}
.eyebrow{letter-spacing:.18em;font-size:12px;font-weight:bold;color:var(--navy);text-transform:uppercase;text-align:right}
h1{font-size:30px;margin:26px 0 4px;text-transform:uppercase;letter-spacing:.01em}
.bar{width:96px;height:4px;background:var(--ink);margin:10px 0 18px}
.who{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--mut)}
.who b{color:var(--ink)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:bold;letter-spacing:.04em}
.pill.doc{background:var(--navy);color:#fff}.pill.stu{background:#dfe9f5;color:var(--navy)}
select.stud{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:bold;color:var(--navy)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:8px}
.cal{padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{text-transform:capitalize}
.calh button{border:1px solid var(--line);background:#fff;border-radius:6px;width:32px;height:32px;cursor:pointer;color:var(--navy);font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days .wd{font-size:11px;font-weight:bold;color:var(--mut);padding:2px 0}
.d{position:relative;border:1px solid transparent;background:var(--soft);border-radius:6px;height:36px;cursor:pointer;font-weight:bold;color:var(--ink);font-size:14px}
.d.out{visibility:hidden}
.d.has::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--acc)}
.d.today{border-color:var(--navy)}
.d.sel{background:var(--navy);color:#fff}
.d:disabled{opacity:.35;cursor:default}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:4px;vertical-align:1px}
.legend s{display:inline-block;width:12px;height:12px;border:1px solid var(--navy);border-radius:3px;margin-right:4px;vertical-align:-2px}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 4px;cursor:pointer;font-size:13px;font-weight:bold;color:var(--navy)}
.sum{padding:12px;margin-top:14px}
.sum h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--navy);text-transform:uppercase}
.sum .n{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sum .n div{background:var(--soft);border-radius:6px;padding:8px 2px}
.sum .n b{display:block;font-size:20px}
.sum .n span{font-size:11px;color:var(--mut)}
.day{padding:16px 16px 18px}
.dayh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px}
.dayh h2{margin:0;font-size:24px}
.dayh .bar{margin:8px 0 0}
.status{font-size:13px;color:var(--mut)}
.status.ok{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:bold;font-size:13px}
.btn.pri{background:var(--navy);color:#fff}
.head4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border:1px solid var(--line);margin:16px 0 12px}
.head4>div{padding:6px 8px;border-right:1px solid var(--line)}
.head4>div:last-child{border-right:0}
.lab{display:block;font-size:12px;font-weight:bold;color:var(--ink);margin-bottom:3px}
.sec{margin-top:12px;border:1px solid var(--line)}
.sec>h4{margin:0;background:var(--navy);color:#fff;font-size:13px;letter-spacing:.02em;padding:6px 8px;text-transform:uppercase}
.sec>h4 small{text-transform:none;font-weight:normal;opacity:.85}
.rows .hd,.rows .r{display:grid;grid-template-columns:var(--cols)}
.rows .hd{background:var(--soft2);font-size:12px;font-weight:bold}
.rows .hd>div,.rows .r>div{padding:5px 7px;border-top:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.rows .hd>div:last-child,.rows .r>div:last-child{border-right:0}
.rows .r .lab{display:none}
.num{font-weight:bold;color:var(--mut);text-align:center}
.extra{border-top:1px solid var(--line);padding:6px 8px;font-size:13px}
.extra .lab{display:inline;margin-right:6px}
input[type=text],input[type=date],textarea{width:100%;border:1px solid transparent;background:var(--soft);border-radius:4px;padding:5px 6px;min-height:30px}
textarea{resize:vertical;min-height:52px}
input[type=text]:focus,input[type=date]:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;background:#fff;border-color:var(--navy)}
.chk{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;font-size:13px;cursor:pointer;white-space:nowrap}
.chk input{width:16px;height:16px;accent-color:var(--navy);margin:0}
.done{display:flex;justify-content:center}
.done input{width:20px;height:20px;accent-color:var(--ok)}
/* vista studente */
.ro .val{white-space:pre-wrap;min-height:20px}
.ro .tag{display:inline-block;background:#dfe9f5;color:var(--navy);border-radius:4px;padding:1px 7px;margin:1px 4px 1px 0;font-size:12px;font-weight:bold}
.ro .yes{color:var(--ok);font-weight:bold}.ro .no{color:var(--mut)}
.empty{padding:28px 10px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.msub{margin:22px 0 0;font-size:18px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px}
.gen{margin-top:12px}
.gen summary{cursor:pointer;font-weight:bold;color:var(--navy);padding:8px 0}
.gen .g2{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--line)}
.gen .g2>div{padding:5px 8px;border-top:1px solid var(--line)}
.gen .g2>div:nth-child(odd){background:var(--soft);font-weight:bold;font-size:13px}
.gen .g2>div:nth-child(-n+2){border-top:0}
.how{margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;color:#33404f}
.how b{color:var(--navy)}
footer{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--mut)}
footer b{color:var(--ink)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  h1{font-size:24px}
  .head4{grid-template-columns:1fr 1fr}
  .head4>div:nth-child(2){border-right:0}
  .head4>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .rows .hd{display:none}
  .rows .r{grid-template-columns:1fr!important;border-top:2px solid var(--line)}
  .rows .r>div{border-right:0;border-top:0;padding:4px 8px}
  .rows .r .lab{display:block}
  .rows .r .num{text-align:left;padding-top:8px}
  .done{justify-content:flex-start}
  .gen .g2{grid-template-columns:1fr}
  .gen .g2>div:nth-child(odd){border-top:1px solid var(--line)}
  .eyebrow{font-size:10px}
}
@media print{
  body{background:#fff;font-size:11px}
  .demo,.tabs,.cal,.sum,.tools,.how,.status,.gen summary,.quick,.nop{display:none!important}
  .grid{display:block}.card{border:0}.day{padding:0}
  .wrap{max-width:none;padding:0}
  input[type=text],input[type=date],textarea{background:none;border:0;padding:0;min-height:0}
  textarea{resize:none}
  .sec{break-inside:avoid}
  @page{size:A4;margin:14mm}
}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{border:1px solid #c9d2e3;background:#fff;color:#0B1530;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;font-family:inherit;line-height:1.2;cursor:pointer}.tab.on{background:#0B1530;color:#fff;border-color:#0B1530}
</style>
</head>
<body>
<style>
textarea.g{min-height:30px;resize:none;overflow:hidden;line-height:1.35}
details.sec>summary{list-style:none;cursor:pointer;margin:0;background:var(--navy);color:#fff;font-size:13px;letter-spacing:.02em;padding:7px 8px;text-transform:uppercase;font-weight:bold;display:flex;justify-content:space-between;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+ apri";text-transform:none;font-weight:normal;opacity:.85;white-space:nowrap}
details.sec[open]>summary::after{content:"– chiudi"}
details.sec.vuota>summary{background:#5d7189}
details.sec>summary small{text-transform:none;font-weight:normal;opacity:.85}
.sum .n{grid-template-columns:repeat(2,1fr)}
.scad{margin-top:10px}
.scad h3{margin-top:4px}
.scad ul{list-style:none;margin:0;padding:0}
.scad li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.scad li b{white-space:nowrap;color:var(--navy);min-width:86px}
.scad .none{font-size:13px;color:var(--mut)}
.mat{font-size:18px;font-weight:bold;color:var(--navy);margin:0 0 4px}
@media (max-width:820px){.grid>aside{order:2}}
@media print{details.sec>summary::after{content:""}details.sec.vuota{display:none}}
</style>

async function decifra(t){const u=unb64(t);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEYC,u.slice(12))))}
function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}
  if(f||r.length){r.push(f);R.push(r)}return R}

const PUO=h=>{const v=DOCENTI[h];if(!v)return false;if(typeof v==='string'||!v.m||v.m.includes('*'))return true;return v.m.some(x=>norm(MAT).startsWith(norm(x))||norm(x).startsWith(norm(MAT)))};

function testo(r){
  const out=[];
  SEZ.forEach(s=>{const parti=[];
    for(let i=0;i<s.rows;i++){const v=s.f.filter(f=>f.ty!=='done').map(f=>{const x=r[s.n+'.'+i+'.'+f.k];return has(x)?(Array.isArray(x)?x.join(', '):(f.ty==='date'?f.l+' '+fmtS(x):x)):''}).filter(Boolean);
      if(v.length)parti.push(v.join(' · ')+(r[s.n+'.'+i+'.ok']?' [completata]':''))}

  for(const [k,v] of Object.entries(p)){if(now-v.t>20*60*1000){delete p[k];ch=true;continue}
    if(k==='GEN')D.gen=v.dati||{};else if(v.dati&&Object.keys(v.dati).length)D.days[k]=v.dati;else delete D.days[k]}

/* ---------- riepilogo del mese e prossime scadenze (calcolati da soli) ---------- */
function summary(){
  const y=VIEW.getFullYear(),mo=VIEW.getMonth();let giorni=0,ass=0,comp=0,recu=0;const sc=[];
  Object.entries(DB.days).forEach(([k,r])=>{
    if(!visible(k)||!filled(r))return;
    const d=new Date(k+'T12:00'),inMese=d.getFullYear()===y&&d.getMonth()===mo;
    if(inMese){giorni++;if((r['8.ex.st']||[]).includes('Da recuperare'))recu++}
    SEZ.forEach(s=>{if(s.n>=8)return;for(let i=0;i<s.rows;i++){
      const any=s.f.some(f=>f.ty!=='done'&&has(r[s.n+'.'+i+'.'+f.k]));if(!any)continue;
      if(inMese){ass++;if(r[s.n+'.'+i+'.ok'])comp++}
      s.f.filter(f=>f.due).forEach(f=>{const v=r[s.n+'.'+i+'.'+f.k];if(v&&v>=T){
        const what=r[s.n+'.'+i+'.arg']||r[s.n+'.'+i+'.att']||'';sc.push([v,f.due+(what?': '+what:'')])}})}});
  });
  sc.sort((a,b)=>a[0]<b[0]?-1:1);
  const uniq=[...new Map(sc.map(x=>[x.join('|'),x])).values()].slice(0,5);
  $('#sum').innerHTML='<h3>Riepilogo del mese</h3><div class="n">'+
    [[giorni,'giorni con compiti'],[ass,'attività assegnate'],[comp,'completate'],[recu,'giorni da recuperare']].map(([v,l])=>'<div><b>'+v+'</b><span>'+l+'</span></div>').join('')+
    '</div><div class="scad"><h3>Prossime scadenze</h3>'+(uniq.length?'<ul>'+uniq.map(([d,t])=>'<li><b>'+esc(fmtS(d))+'</b><span>'+esc(t)+'</span></li>').join('')+'</ul>':'<div class="none">Nessuna scadenza in arrivo.</div>')+'</div>';
}

  }
  if(f.ty==='done')return '<div class="done"><input type="checkbox" data-k="'+key+'"'+(v?' checked':'')+' aria-label="'+f.l+'"></div>';
  if(f.ty==='chk')return f.o.map(o=>'<label class="chk"><input type="checkbox" data-k="'+key+'" data-o="'+esc(o)+'"'+((v||[]).includes(o)?' checked':'')+'>'+esc(o)+'</label>').join('');
  if(f.ty==='date')return '<input type="date" data-k="'+key+'" value="'+esc(v||'')+'">';
  if(f.ty==='area')return '<textarea data-k="'+key+'" rows="2">'+esc(v||'')+'</textarea>';
  return '<textarea class="g" rows="1" data-k="'+key+'"'+(f.ty==='short'?' style="max-width:320px"':'')+'>'+esc(v||'')+'</textarea>';
}
const rowHas=(s,i,r)=>s.f.some(f=>f.ty!=='done'&&has(r[s.n+'.'+i+'.'+f.k]));
const exHas=(s,r)=>(s.ex||[]).some(f=>has(r[s.n+'.ex.'+f.k]));
function sections(r){
  const ro=ROLE==='studente';let h='';
  SEZ.forEach(s=>{
    const rows=[...Array(s.rows).keys()].filter(i=>!ro||rowHas(s,i,r));
    const piena=[...Array(s.rows).keys()].some(i=>rowHas(s,i,r))||exHas(s,r);
    if(ro&&!piena)return;
    const tit=s.n+'. '+esc(s.t)+(s.opt?' <small>'+s.opt+'</small>':'');
    h+=ro?'<div class="sec"><h4>'+tit+'</h4>':'<details class="sec'+(piena?'':' vuota')+'"'+(piena?' open':'')+'><summary><span>'+tit+'</span></summary>';
    if(s.rows){
      h+='<div class="rows" style="--cols:'+s.cols+'"><div class="hd">'+(s.nonum?'':'<div>N.</div>')+s.f.map(f=>'<div>'+esc(f.l)+'</div>').join('')+'</div>';
      rows.forEach(i=>{h+='<div class="r">'+(s.nonum?'':'<div class="num">'+(i+1)+'</div>')+s.f.map(f=>'<div><span class="lab">'+esc(f.l)+'</span>'+ctrl(s.n+'.'+i+'.'+f.k,f,r)+'</div>').join('')+'</div>'});
      h+='</div>';
    }
    (s.ex||[]).forEach(f=>{const k=s.n+'.ex.'+f.k;if(ro&&!has(r[k]))return;
      h+='<div class="extra">'+(f.l?'<span class="lab">'+esc(f.l)+'</span>':'')+(f.ty==='area'&&!ro?'<div style="margin-top:4px">'+ctrl(k,f,r)+'</div>':ctrl(k,f,r))+'</div>'});
    h+=ro?'</div>':'</details>';
  });
  return h;
}
const GEN=[['nome','Nome e cognome dello studente'],['ind','Indirizzo di studio'],['cla','Classe / annualità'],['doc','Docente'],['ora','Orario delle lezioni in diretta']];
function genBox(){
  const g=DB.gen||{};
  if(ROLE==='studente')return '';
  const vuoto=!g.nome;
  return '<details class="gen"'+(vuoto?' open':'')+'><summary>Dati generali'+(vuoto?' — da compilare la prima volta':'')+'</summary><div class="g2">'+GEN.map(([k,l])=>'<div>'+l+'</div><div><input type="text" data-g="'+k+'" value="'+esc(g[k]||'')+'"></div>').join('')+'</div></details>';
}
function day(){
  const k=iso(SEL),ro=ROLE==='studente',r=rec(k)||{},g=DB.gen||{};
  let h='<div class="dayh"><div><h2>'+fmtL(SEL)+'</h2><div class="bar"></div></div><div class="tools">'+(ro?'':'<span class="status" id="st"></span><button class="btn pri" id="sv">Salva</button>')+'<button class="btn" id="pr">Stampa / PDF</button></div></div>';
  h+='<div class="head4"><div><span class="lab">Studente</span>'+esc(g.nome||'')+'</div><div><span class="lab">Materia</span>'+esc(MAT)+'</div><div><span class="lab">Docente</span>'+esc(g.doc||'')+'</div><div><span class="lab">Prossima diretta</span>'+(ro?esc(fmtS(r.dir)):'<input type="date" data-k="dir" value="'+esc(r.dir||'')+'">')+'</div></div>';
  h+=genBox();
  if(ro&&!filled(r))h+='<div class="empty"><b>Nessun compito per questo giorno</b>Guarda i giorni con il pallino giallo.</div>';
  else h+=sections(r);
  $('#day').innerHTML=h;
  $('#pr').onclick=()=>{document.querySelectorAll('details.sec:not(.vuota)').forEach(d=>d.open=true);window.print()};
  if(ro)return;
  $('#sv').onclick=()=>{clearTimeout(tmr);stato('Salvataggio…');salva()};
  $('#day').querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='checkbox'&&el.dataset.o!==undefined)el.onchange=()=>setv(k,[...$('#day').querySelectorAll('input[data-k="'+k+'"][data-o]')].filter(x=>x.checked).map(x=>x.dataset.o));
    else if(el.type==='checkbox')el.onchange=()=>setv(k,el.checked);
    else el.oninput=el.onchange=()=>setv(k,el.value);
  });
  $('#day').querySelectorAll('[data-g]').forEach(el=>el.oninput=()=>{DB.gen=DB.gen||{};DB.gen[el.dataset.g]=el.value;GENDIRTY=true;saved();
    const n=$('#day').querySelectorAll('.head4>div');n[0].innerHTML='<span class="lab">Studente</span>'+esc(DB.gen.nome||'');n[2].innerHTML='<span class="lab">Docente</span>'+esc(DB.gen.doc||'')});
  $('#day').querySelectorAll('[data-g]').forEach(el=>el.onchange=()=>head());
  const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};
  $('#day').querySelectorAll('textarea').forEach(t=>{grow(t);t.addEventListener('input',()=>grow(t))});
  $('#day').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>d.querySelectorAll('textarea').forEach(grow)));
}
function render(){head();calendar();summary();day()}

/* ---------- comandi ---------- */
const goMonth=n=>{VIEW=new Date(VIEW.getFullYear(),VIEW.getMonth()+n,1,12);head();calendar();summary()};
$('#pm').onclick=()=>goMonth(-1);$('#nm').onclick=()=>goMonth(1);
const goDay=d=>{SEL=d;VIEW=new Date(d.getFullYear(),d.getMonth(),1,12);render()};
$('#oggi').onclick=()=>goDay(new Date(TODAY));$('#ieri').onclick=()=>goDay(add(TODAY,-1));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ROLE=b.dataset.r;if(ROLE==='studente'&&iso(SEL)>T)goDay(new Date(TODAY));else render()});
$('#reset').onclick=()=>{DB=seed();store();goDay(new Date(TODAY))};
function avvio(){
  if(!LIVE){render();return}
  head();calendar();$('#day').innerHTML='<div class="empty"><b>Caricamento del registro…</b></div>';$('#sum').innerHTML='';
  (async()=>{await alunno();await chiavi();await docenti();
    const t=await (await fetch(CSV+(CSV.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'})).text();
    const D={gen:{},days:{}};
    for(const r of csv(t).slice(1)){if(r[1]!==RID||!r[3])continue;
      try{const o=await decifra(r[3]);if(!DOCENTI[o.p])continue;
        if(r[2]==='GEN')D.gen=o.gen||{};else if(o.dati&&Object.keys(o.dati).length)D.days[r[2]]=o.dati;else delete D.days[r[2]]}catch(e){}}
    unisci(D);DB=D;const ph=PIN?await pinhash(PIN):'';DOCNAME=DNOME(ph);ROLE=DOCNAME&&PUO(ph)?'docente':'studente';if(Q.get('vista')==='studente')ROLE='studente';
    if(DOCNAME&&!PUO(ph))setTimeout(()=>stato('Sola lettura: questa materia non è tra le tue'),50);
    if(!DOCNAME&&PIN){PIN='';try{localStorage.removeItem('telesio_pin')}catch(e){}}
    if(ROLE==='studente'&&iso(SEL)>T)SEL=new Date(TODAY);
    if(!(DB.gen&&DB.gen.nome)&&ALUNNO&&ALUNNO.nome){DB.gen=Object.assign({},DB.gen,{nome:ALUNNO.nome,ind:ALUNNO.indirizzo||''})}
    if(ROLE==='docente'&&!(DB.gen&&DB.gen.nome)&&Q.get('n')){DB.gen=Object.assign({},DB.gen,{nome:Q.get('n'),ind:Q.get('i')||''});GENDIRTY=true;saved()}
    render();
  })().catch(()=>{$('#day').innerHTML='<div class="empty"><b>Il registro non si è caricato</b>Controlla la connessione e ricarica la pagina.</div>'});
}
/* quaderno dei compiti: QR per consegnare con il telefono (solo vista studente) */
let QRLIB=null;
function quaderno(){const q=$('#qq');if(!q)return;if(!(LIVE&&ROLE==='studente')){q.style.display='none';return}
  const u='https://zagavre-ai.github.io/Lezioni/quaderno/#c='+encodeURIComponent(CODE);q.style.display='flex';
  q.innerHTML='<div style="flex:1 1 260px"><b style="color:var(--navy);letter-spacing:.06em">QUADERNO DEI COMPITI</b><p style="margin:6px 0 10px">Qui trovi i compiti da consegnare, i voti e le correzioni. Hai svolto un compito su carta? <b>Inquadra il codice con la fotocamera del telefono</b>, fotografa le pagine e premi «Consegna».</p><a href="'+u+'" target="_blank" rel="noopener" style="display:inline-block;background:var(--navy);color:#fff;font-weight:bold;padding:11px 18px;border-radius:8px;text-decoration:none">Apri il mio quaderno</a></div><div id="qrc" style="flex:0 0 auto"></div>';
  QRLIB=QRLIB||new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  QRLIB.then(()=>{const b=$('#qrc');if(b){b.innerHTML='';new QRCode(b,{text:u,width:140,height:140,correctLevel:QRCode.CorrectLevel.M})}}).catch(()=>{const b=$('#qrc');if(b)b.textContent='(il codice QR non si è caricato: usa il link qui sotto)'})}
avvio();
</script>
