<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Prova PDF resoconto</title></head><body style="margin:0;font-family:sans-serif">
<p style="padding:8px">Pagina di prova (dati finti) del PDF del resoconto. <span id="st">…</span></p>
<iframe id="v" style="width:100%;height:92vh;border:0"></iframe>
<script>
const T='2026-11-18';
const fmtS=s=>{if(!s)return'';return new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})};
/* 16/11: PDF del resoconto nella gabbia della dispensa A4 Telesio (logo, linee, titolo con barretta, piè «Pagina N», Liberation Sans) */
async function pdfResoconto(R,soloDoc){
  const load=u=>new Promise((ok,ko)=>{const t=document.createElement('script');t.src=u;t.onload=ok;t.onerror=ko;document.head.appendChild(t)});
  if(!window.jspdf)await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!window.jspdf.jsPDF.API.autoTable)await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  const b64=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);const a=new Uint8Array(await r.arrayBuffer());let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
  if(!window.__PDFA)window.__PDFA={reg:await b64('assets/LiberationSans-Regular.ttf'),bold:await b64('assets/LiberationSans-Bold.ttf'),logo:'data:image/png;base64,'+await b64('assets/logo_orizzontale.png')};
  const A=window.__PDFA,{jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'});
  d.addFileToVFS('LS.ttf',A.reg);d.addFont('LS.ttf','LS','normal');d.addFileToVFS('LSB.ttf',A.bold);d.addFont('LSB.ttf','LS','bold');
  const NOTTE=[10,29,55],BLU=[0,51,102],FIL=[203,213,225],TX=[26,26,26],FONDO=[248,249,250],M=57,PW=595.28,W=PW-2*M;
  const pul=t=>String(t||'').replace(/[✓→]/g,'').replace(/\s+/g,' ').trim();
  d.setFont('LS','bold');d.setFillColor(...NOTTE);d.rect(M,186-3,69,3,'F');
  d.setFontSize(28);d.setTextColor(...NOTTE);d.text('Resoconto della settimana',M,230);
  d.setFontSize(12);d.setTextColor(...BLU);d.text(pul(R.nome)+' · '+pul(R.mat),M,252,{maxWidth:W});
  d.setFont('LS','normal');d.setFontSize(10.5);d.setTextColor(...TX);d.text(pul(R.periodo),M,268);
  d.setFontSize(8.5);d.setTextColor(95,105,120);d.text('Il resoconto si calcola dal piano didattico, dalle videolezioni, dalle lezioni in diretta e dal quaderno dei compiti.',M,282,{maxWidth:W});
  const tab={theme:'plain',rowPageBreak:'avoid',margin:{left:M,right:M,top:110,bottom:92},styles:{font:'LS',fontSize:9.5,cellPadding:{top:4,bottom:4,left:4,right:4},textColor:TX,overflow:'linebreak',valign:'top'},
    headStyles:{font:'LS',fontStyle:'bold',fillColor:FONDO,textColor:NOTTE,fontSize:9},
    didDrawCell:h=>{d.setDrawColor(...FIL);d.setLineWidth(0.5);d.line(h.cell.x,h.cell.y+h.cell.height,h.cell.x+h.cell.width,h.cell.y+h.cell.height)}};
  d.autoTable(Object.assign({},tab,{startY:298,head:[R.cnt.map(c=>c[1])],body:[R.cnt.map(c=>String(c[0]))],styles:Object.assign({},tab.styles,{halign:'center'}),
    headStyles:Object.assign({},tab.headStyles,{halign:'center',fontStyle:'normal',fontSize:8,textColor:[95,105,120]}),bodyStyles:{fontStyle:'bold',fontSize:14,textColor:BLU}}));
  const sez=(t,head,body,vuoto,col0)=>{let y=d.lastAutoTable.finalY+26;if(y>690){d.addPage();y=126}
    d.setFont('LS','bold');d.setFontSize(12);d.setTextColor(...BLU);d.text(t,M,y);
    if(!body.length){d.setFont('LS','normal');d.setFontSize(10);d.setTextColor(...TX);d.text(vuoto,M,y+16);d.lastAutoTable.finalY=y+18;return}
    d.autoTable(Object.assign({},tab,{startY:y+6,head:[head],body,columnStyles:{0:{cellWidth:col0||100,fontStyle:'bold'},2:{cellWidth:96},3:{cellWidth:58}},
      didParseCell:h=>{if(h.section==='body'&&h.column.index===0){const v=String(h.cell.raw||'');h.cell.styles.textColor=/^Complet/.test(v)?[46,158,91]:/^(Iniziata|Da finire|Da rivedere)/.test(v)?[201,103,26]:/^In programma/.test(v)?[32,96,175]:/^(Non svolta|Da svolgere|Assente|Segnalato)/.test(v)?[179,38,30]:BLU}}}))};
  const stato=x=>R.fatta(x)?'Completata il '+fmtS(x.cd)+(x.pun?' · test '+x.pun:''):R.inCorso(x)?'Iniziata il '+fmtS(x.pv)+', non finita':x.g>T?'In programma':'Non svolta';
  const righe=R.PL.slice().sort((a,b)=>a.g<b.g?-1:a.g>b.g?1:0).map(x=>[stato(x),pul(R.tit(x)),pul(x.c),fmtS(x.g)]);
  R.extra.forEach(x=>righe.push(['Completata il '+fmtS(x.g)+(x.p?' · test '+x.p:''),pul(x.n?R.tit(x):x.t),pul(x.c),'fuori piano']));
  R.RV.slice().sort((a,b)=>a.g<b.g?-1:1).forEach(x=>righe.push(['Da rivedere (già completata il '+fmtS(x.cd)+')',pul(R.tit(x))+(x.nota?' — '+pul(String(x.nota).replace(/^Corso n\. \d+( · )?/,'')):''),pul(x.c),fmtS(x.g)]));
  sez('1. Videolezioni assegnate nel piano didattico',['Stato','Lezione','Corso','Nel piano'],righe,'Per questa settimana il piano didattico non riporta videolezioni.',100);
  sez('2. Lezioni in diretta',['Presenza','Lezione','Docente','Giorno'],R.Lv.map(x=>[(x.ass?'Assente':'Presente')+(x.voto?' · voto '+x.voto:''),pul(x.t)+(x.fb?'\nGiudizio: '+pul(x.fb):''),pul(x.doc),fmtS(x.g)]),'Nessuna lezione in diretta registrata in questa settimana.',86);
  sez('3. Compiti del quaderno',['Stato','Compito','Docente','Giorno'],R.Qd.map(x=>['Compito '+pul(x.e)+(x.v?' · voto '+x.v:''),pul(x.t)+(x.sc?'\nScadenza '+fmtS(x.sc):''),pul(x.doc),fmtS(x.g)]),'Nessun compito del quaderno in questa settimana.',86);
  sez('4. Da recuperare',['Stato','Lezione','Corso','Era nel piano'],R.daRec.map(x=>[R.inCorso(x)?'Da finire':'Da svolgere',pul(R.tit(x)),pul(x.c),fmtS(x.g)]).concat(R.rec8.map(x=>['Segnalato dal docente',pul(x.t),'',fmtS(x.g)])),'Niente da recuperare per questa settimana.',86);
  const n=d.internal.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);
    d.addImage(A.logo,'PNG',M,57,23*900/285,23);
    d.setFont('LS','normal');d.setFontSize(8.5);d.setTextColor(...BLU);d.text('Registro dei compiti · resoconto della settimana',PW-M,72,{align:'right'});
    d.setDrawColor(...FIL);d.setLineWidth(0.75);d.line(M,85,PW-M,85);d.line(M,762,PW-M,762);
    d.setFont('LS','bold');d.setFontSize(7.5);d.setTextColor(...BLU);d.text(('Resoconto · '+pul(R.nome)+' · '+pul(R.mat)).toUpperCase(),M,775,{maxWidth:W-70});
    d.setTextColor(...NOTTE);d.text('Pagina '+i,PW-M,775,{align:'right'})}
  if(soloDoc)return d;
  d.save('Resoconto_'+String(R.nome).replace(/[^A-Za-z0-9]+/g,'_')+'_'+R.k0+'.pdf');
}

const L=(g,t,c,cd,pun,pv)=>({g,t,c,cd,pun,pv});
const PL=[L('2026-11-16','LEZIONE 5: DOMINIO DI FUNZIONI RAZIONALI FRATTE','Matematica V - LSU/IP','2026-11-16','90%'),L('2026-11-16','LEZIONE 9: SAPERE E VERITÀ IN DISCUSSIONE','Filosofia V',null,null,'2026-11-16'),
L('2026-11-17','LEZIONE 1: L\'ETÀ DEL NATURALISMO E DEL DECADENTISMO','Letteratura italiana V'),L('2026-11-19','LEZIONE 3: JOHN KEATS','Letteratura inglese V'),L('2026-11-20','LEZIONE 44: IL CALORE (2° PARTE)','Fisica V - LSU-LL')];
for(let i=0;i<14;i++)PL.push(L('2026-11-'+(16+i%5),'LEZIONE '+(10+i)+': ARGOMENTO DI PROVA CON UN TITOLO ABBASTANZA LUNGO DA ANDARE A CAPO','Corso di prova '+i));
const R={periodo:'Lunedì 16 novembre – domenica 22 novembre',k0:'2026-11-16',nome:'ROSSI MARIO (PROVA)',mat:'Tutte le materie',tutte:true,PL,RV:[],extra:[],
 Lv:[{g:'2026-11-17',t:'LEZIONE 1 IN DIRETTA - ITALIANO',doc:'Prof. Giorgio Mazzotti',voto:'7',fb:'Buona partecipazione.'},{g:'2026-11-19',t:'LEZIONE 2 IN DIRETTA - ITALIANO',doc:'Prof. Giorgio Mazzotti',ass:true}],
 Qd:[{g:'2026-11-17',t:'Analisi del testo: Pianto antico',e:'consegnato',v:'8',doc:'Prof. Giorgio Mazzotti',sc:'2026-11-17'}],daRec:[PL[1]],rec8:[],
 fatta:x=>!!x.cd,inCorso:x=>!x.cd&&!!x.pv,tit:x=>x.t,cnt:[[19,'lezioni nel piano'],[1,'completate'],[1,'iniziate, non finite'],[3,'non svolte'],[14,'in programma'],[2,'lezioni in diretta'],[1,'compiti del quaderno']]};
pdfResoconto(R,true).then(d=>{document.getElementById('v').src=URL.createObjectURL(d.output('blob'));document.getElementById('st').textContent='pronto, '+d.internal.getNumberOfPages()+' pagine'}).catch(e=>{document.getElementById('st').textContent='ERRORE '+e});
</script></body></html>
