<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fig;font-weight:400;src:url(file:///root/.fonts/Figtree-Regular.ttf)}
@font-face{font-family:Fig;font-weight:600;src:url(file:///root/.fonts/Figtree-SemiBold.ttf)}
@font-face{font-family:Fig;font-weight:700;src:url(file:///root/.fonts/Figtree-Bold.ttf)}
@font-face{font-family:Bri;font-weight:800;src:url(file:///root/.fonts/BricolageGrotesque-ExtraBold.ttf)}
html,body{margin:0;padding:0;background:#fff;overflow:hidden}
#page{position:relative;width:1920px;height:1080px;background:#fff;overflow:hidden;font-family:Fig,sans-serif;color:#0B1530}
#kick{position:absolute;left:60px;top:22px;font:700 22px Fig;letter-spacing:.14em;color:#2060AF}
#ttl{position:absolute;left:60px;top:48px;font:800 54px Bri;color:#2060AF;white-space:nowrap}
#line{position:absolute;left:60px;right:60px;top:122px;height:2px;background:#CBD5E1}
#leg{position:absolute;right:60px;top:30px;display:flex;gap:14px;font:600 18px Fig;color:#0B1530}
#leg span{display:flex;align-items:center;gap:6px}
#leg i{display:inline-block;width:22px;height:16px;border-radius:4px;border:3px solid}
#foot{position:absolute;left:60px;right:60px;bottom:18px;display:flex;justify-content:space-between;font:700 20px Fig;letter-spacing:.06em;color:#2060AF}
#fline{position:absolute;left:60px;right:60px;bottom:52px;height:2px;background:#CBD5E1}
#view{position:absolute;left:0;top:126px;width:1920px;height:900px;overflow:hidden}
#cam{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cv{position:relative}
.b{position:absolute;box-sizing:border-box;padding:14px 24px;border-radius:16px;font:600 36px/1.32 Fig;text-align:center;opacity:0;border-width:5px;border-style:solid}
.b b{font-weight:700}
.b small{display:block;font:600 34px Fig;margin-top:6px}
.b ul{margin:6px 0 0;padding:0;list-style:none;text-align:left}
.b li{position:relative;padding-left:30px;margin:4px 0}
.b li:before{content:"";position:absolute;left:4px;top:.55em;width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.55}
.b.hasul{text-align:left}
.c{background:#FFDCC6;border-color:#C2410C;font:800 52px/1.15 Bri;border-radius:20px;border-width:6px;padding:18px 28px}
.c small{font:600 38px Fig}
.d{background:#DCEEFB;border-color:#1D4ED8}
.k{background:#FFF3BF;border-color:#A16207}
.e{background:#DDF3E4;border-color:#15803D}
.q{background:#EBE3F7;border-color:#6D28D9}
.b.im{padding:14px}
.b.im img{display:block;width:100%;border-radius:8px;margin-bottom:10px}
.b.im .cp{font-size:34px;line-height:1.25;text-align:center}
.hl{box-shadow:0 0 0 10px #FFE600,0 10px 24px rgba(11,21,48,.18)}
#sv{position:absolute;left:0;top:0;overflow:visible}
.al{position:absolute;opacity:0;font:700 34px/1.2 Fig;background:#fff;padding:2px 10px;color:#0B1530;white-space:nowrap;border-radius:8px}
#intro{position:absolute;left:0;top:126px;width:1920px;height:900px;display:flex;align-items:center;justify-content:center;font:800 96px/1.1 Bri;color:#2060AF;text-align:center;padding:0 120px;box-sizing:border-box;opacity:0}
body.pdf #page{width:1123px;height:794px}
body.pdf #kick{left:34px;top:12px;font-size:13px}
body.pdf #ttl{left:34px;top:28px;font-size:34px}
body.pdf #leg{right:34px;top:20px;font-size:11px;gap:8px}
body.pdf #leg i{width:14px;height:10px;border-width:2px}
body.pdf #line{left:34px;right:34px;top:76px}
body.pdf #view{top:82px;width:1123px;height:664px}
body.pdf #fline{left:34px;right:34px;bottom:40px}
body.pdf #foot{left:34px;right:34px;bottom:14px;font-size:12px}
</style></head><body>
<div id="page">
 <div id="kick">MAPPA DEL PROFESSORE</div><div id="ttl"></div>
 <div id="leg"><span><i style="background:#FFDCC6;border-color:#C2410C"></i>concetto centrale</span><span><i style="background:#DCEEFB;border-color:#1D4ED8"></i>date e sequenze</span><span><i style="background:#FFF3BF;border-color:#A16207"></i>parole chiave</span><span><i style="background:#DDF3E4;border-color:#15803D"></i>esempi e opere</span><span><i style="background:#EBE3F7;border-color:#6D28D9"></i>conseguenze</span></div>
 <div id="line"></div>
 <div id="view"><div id="cam"><div id="cv"><svg id="sv"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="44" markerHeight="44" refX="30" refY="22" orient="auto"><path d="M0,4 L40,22 L0,40 z" fill="#0B1530"/></marker></defs></svg></div></div></div>
 <div id="intro"></div>
 <div id="fline"></div><div id="foot"><span>STORIA DELL'ARTE V</span><span id="pg"></span></div>
</div>
<script>
const D=__DATA__;           // {W,H,titolo,pagina,boxes,arrows,steps:[{t0,t1,boxes,arrows,hl,cam}],end,zoomT}
const MODE=new URLSearchParams(location.search).get('mode')||'video';
const cv=document.getElementById('cv'), cam=document.getElementById('cam'), sv=document.getElementById('sv');
document.getElementById('ttl').textContent=D.titolo; document.getElementById('pg').textContent='Pagina '+D.pagina;
document.getElementById('intro').textContent=D.titolo;
cv.style.width=D.W+'px'; cv.style.height=D.H+'px'; sv.setAttribute('width',D.W); sv.setAttribute('height',D.H);
const els={};
for(const b of D.boxes){const e=document.createElement('div');e.className='b '+b.cls+(b.img?' im':'')+(b.html.includes('<ul>')&&!b.img?' hasul':'');
  e.style.left=b.x+'px';e.style.top=b.y+'px';e.style.width=b.w+'px';
  e.innerHTML=b.img?`<img src="img/${b.img}.jpg"><div class="cp">${b.html}</div>`:b.html;cv.appendChild(e);els[b.id]=e;}
const R={};            // rettangoli
function rects(){for(const id in els){const e=els[id];R[id]={x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight};}}
function clip(r,cx,cy,dx,dy,gap){ // punto sul bordo del rettangolo r lungo la direzione (dx,dy) dal centro
  const hw=r.w/2+gap,hh=r.h/2+gap;let t=Math.min(hw/Math.abs(dx||1e-9),hh/Math.abs(dy||1e-9));return [cx+dx*t,cy+dy*t];}
function side(r,s,gap){const m={t:[r.x+r.w/2,r.y-gap],b:[r.x+r.w/2,r.y+r.h+gap],l:[r.x-gap,r.y+r.h/2],r:[r.x+r.w+gap,r.y+r.h/2]};return m[s];}
const AR={};           // frecce: id -> {line,label,len}
function layout(){
  rects();
  for(const a of D.arrows){
    const A=R[a.f],Bq=R[a.t];let p1,p2;
    const ca=[A.x+A.w/2,A.y+A.h/2],cb=[Bq.x+Bq.w/2,Bq.y+Bq.h/2];
    if(a.o&&a.o.length==2){p1=side(A,a.o[0],8);p2=side(Bq,a.o[1],10);}
    else{const dx=cb[0]-ca[0],dy=cb[1]-ca[1];p1=clip(A,ca[0],ca[1],dx,dy,8);p2=clip(Bq,cb[0],cb[1],-dx,-dy,10);}
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',p1[0]);l.setAttribute('y1',p1[1]);l.setAttribute('x2',p2[0]);l.setAttribute('y2',p2[1]);
    l.setAttribute('stroke','#0B1530');l.setAttribute('stroke-width','7');l.setAttribute('marker-end','url(#ah)');l.style.opacity=0;
    const len=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);l.setAttribute('stroke-dasharray',len+' '+len);sv.appendChild(l);
    let lab=null;if(a.l){lab=document.createElement('div');lab.className='al';lab.innerHTML=a.l;cv.appendChild(lab);
      lab.style.left=((p1[0]+p2[0])/2-lab.offsetWidth/2)+'px';lab.style.top=((p1[1]+p2[1])/2-lab.offsetHeight/2)+'px';}
    AR[a.f+'>'+a.t]={line:l,label:lab,len:len};
  }
}
function ease(x){x=Math.max(0,Math.min(1,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function easeO(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3);}
// ------- camera
let VW=1920,VH=900;
if(MODE==='pdf'){document.body.classList.add('pdf');VW=1123;VH=664;}
function union(ids){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const i of ids){const r=R[i];if(!r)continue;x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h);}return [x0,y0,x1,y1];}
function fit(ids,smin,smax,pad){const u=union(ids);const w=u[2]-u[0]+pad,h=u[3]-u[1]+pad;let s=Math.min(VW/w,VH/h);s=Math.max(smin,Math.min(smax,s));return [(u[0]+u[2])/2,(u[1]+u[3])/2,s];}
let OVER=null;
function setupCam(){
  const s=Math.min((VW-(MODE==='pdf'?50:80))/D.W,(VH-(MODE==='pdf'?20:30))/D.H);OVER=[D.W/2,D.H/2,s];
  for(const st of D.steps){
    const ids=st.cam&&st.cam.length?st.cam:st.boxes;
    let c=fit(ids,1.0,1.3,160);   // inquadra il riquadro in lettura (con la sua origine se entra)
    const src=[];for(const a of st.arrows){const f=a[0];src.push(f);}
    const c2=fit(ids.concat(src),1.0,1.3,200);
    const u=union(ids.concat(src));if((u[2]-u[0])<VW*0.92/1.0&&(u[3]-u[1])<VH*0.88)c=c2;
    st.c=c;
  }
}
function camAt(t){
  const S=D.steps;let prev=OVER[0]?[D.W/2,D.H/2,1.0]:null;let cur=null,i=-1;
  for(let k=0;k<S.length;k++){if(t>=S[k].t0-0.4)i=k;}
  // zoom finale
  if(t>=D.zoomT){const e=easeO((t-D.zoomT)/(D.zoomEnd-D.zoomT));const a=S[S.length-1].c;return [a[0]+(OVER[0]-a[0])*e,a[1]+(OVER[1]-a[1])*e,a[2]+(OVER[2]-a[2])*e];}
  if(i<0)return S[0].c;
  const to=S[i].c;const from=i>0?S[i-1].c:to;
  const tt=(t-(S[i].t0-0.4))/1.3;const e=ease(tt);
  const dur=Math.max(1,(S[i].t1-S[i].t0));const dr=1+0.035*Math.min(1,Math.max(0,(t-S[i].t0)/dur));
  return [from[0]+(to[0]-from[0])*e,from[1]+(to[1]-from[1])*e,(from[2]+(to[2]-from[2])*e)*dr];
}
function render(t){
  let sig='';
  const showIntro=t<(D.steps[0].t0-0.1);
  const io=document.getElementById('intro');
  let ip=showIntro?1:Math.max(0,1-(t-(D.steps[0].t0-0.1))/0.5);ip=Math.round(ip*50)/50;io.style.opacity=ip;sig+=ip+'|';
  const hl=new Set();
  for(const st of D.steps){
    for(const a of st.arrows){const o=AR[a[0]+'>'+a[1]];const p=easeO((t-(st.t0-0.05))/0.55);const v=Math.round(p*50)/50;
      o.line.style.opacity=v;o.line.setAttribute('stroke-dashoffset',Math.round(o.len*(1-p)));o.line.setAttribute('marker-end',v>=1?'url(#ah)':'none');if(o.label)o.label.style.opacity=v;sig+=v+',';}
    for(const b of st.boxes){const p=easeO((t-(st.t0+0.15))/0.5);const v=Math.round(p*50)/50;const e=els[b];e.style.opacity=v;e.style.transform='translateY('+Math.round(16*(1-p))+'px)';sig+=v+',';}
    if(t>=st.t0+0.1&&t<st.t1+0.25){for(const h of (st.hl&&st.hl.length?st.hl:st.boxes))hl.add(h);}
  }
  for(const id in els){const on=hl.has(id);els[id].classList.toggle('hl',on);sig+=on?1:0;}
  const c=camAt(t);const s=c[2];
  const tx=Math.round((VW/2-c[0]*s)*10)/10,ty=Math.round((VH/2-c[1]*s)*10)/10,ss=Math.round(s*1000)/1000;
  cam.style.transform=`translate(${tx}px,${ty}px) scale(${ss})`;
  return sig+tx+','+ty+','+ss;
}
async function init(){
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
  layout();
  setupCam();
  window.READY=true;
}
function showAll(){ // mappa intera (PNG finale)
  for(const id in els){els[id].style.opacity=1;els[id].style.transform='none';els[id].classList.remove('hl');}
  for(const k in AR){AR[k].line.style.opacity=1;AR[k].line.setAttribute('stroke-dashoffset',0);AR[k].line.setAttribute('marker-end','url(#ah)');if(AR[k].label)AR[k].label.style.opacity=1;}
  document.getElementById('intro').style.opacity=0;
  cam.style.transform=`translate(${VW/2-OVER[0]*OVER[2]}px,${VH/2-OVER[1]*OVER[2]}px) scale(${OVER[2]})`;
}
function overlaps(){const o=[];const ids=Object.keys(R);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=R[ids[i]],b=R[ids[j]];
  if(a.x<b.x+b.w+16&&b.x<a.x+a.w+16&&a.y<b.y+b.h+16&&b.y<a.y+a.h+16)o.push(ids[i]+'/'+ids[j]);}return o;}
function rectsOut(){return JSON.stringify(R);}
init();
</script></body></html>
