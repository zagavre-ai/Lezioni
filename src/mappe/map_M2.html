  setupCam();
  window.READY=true;
}
function showAll(){ // mappa intera (PNG finale)
  for(const id in els){els[id].style.opacity=1;els[id].style.transform='none';els[id].classList.remove('hl');}
  for(const k in AR){AR[k].line.style.opacity=1;AR[k].line.setAttribute('stroke-dashoffset',0);AR[k].line.setAttribute('marker-end','url(#ah)');if(AR[k].label)AR[k].label.style.opacity=1;}
  document.getElementById('intro').style.opacity=0;
  cam.style.transform=`translate(${VW/2-OVER[0]*OVER[2]}px,${VH/2-OVER[1]*OVER[2]}px) scale(${OVER[2]})`;
}
function overlaps(){const o=[];const ids=Object.keys(R);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=R[ids[i]],b=R[ids[j]];
  if(a.x<b.x+b.w+16&&b.x<a.x+a.w+16&&a.y<b.y+b.h+16&&b.y<a.y+a.h+16)o.push(ids[i]+'/'+ids[j]);}return o;}
function rectsOut(){return JSON.stringify(R);}
