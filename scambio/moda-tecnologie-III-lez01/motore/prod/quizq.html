<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
#tag{position:absolute;left:120px;top:60px;font:700 26px FigB;letter-spacing:.14em;color:#C2410C}
#q{position:absolute;left:120px;top:110px;width:1680px;font:400 54px/1.2 Bri;opacity:0}
.o{position:absolute;left:120px;width:1680px;box-sizing:border-box;padding:14px 28px 14px 100px;border-radius:18px;border:4px solid #CBD5E1;background:#F4F6FA;font:400 40px/1.3 Fig;opacity:0;min-height:96px;display:flex;align-items:center}
.o .l{position:absolute;left:24px;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;background:#2060AF;color:#fff;font:700 30px/52px FigB;text-align:center}
.o.hl{border-color:#2060AF;box-shadow:0 0 0 6px #FFE600}
.o.ok{background:#DDF3E4;border-color:#15803D;box-shadow:none}.o.ok .l{background:#15803D}.o.no{opacity:.25!important}
#sp{position:absolute;left:120px;width:1680px;font:400 38px/1.4 Fig;color:#0B1530;opacity:0}
#sp b{font-family:FigB;color:#15803D}
#bar{position:absolute;left:120px;height:10px;border-radius:5px;background:#FFE600}
</style></head><body><div id="tag"></div><div id="q"></div><div id="os"></div><div id="sp"></div><div id="bar"></div><div class="foot" id="foot"></div>
<script>
const $=i=>document.getElementById(i),ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
let O=[],ST=null,D=null;
function setData(d){D=d;$('tag').textContent=d.tag;$('q').textContent=d.domanda;$('foot').textContent=d.foot;$('os').innerHTML='';O=[];
 const qh=$('q').offsetHeight;let y=110+qh+36;
 d.opz.forEach((t,i)=>{const e=document.createElement('div');e.className='o';e.innerHTML='<span class="l">'+'ABCD'[i]+'</span><span>'+t+'</span>';e.style.top=y+'px';$('os').appendChild(e);O.push(e);y+=e.offsetHeight+16});
 $('sp').style.top=(y+10)+'px';$('sp').innerHTML='<b>✓ Risposta '+'ABCD'[d.ok]+'</b> · '+d.spieg;$('bar').style.top=(y-6)+'px'}
// ST={q:t_domanda, o:[t_opzioni], r:t_risposta, rd:durata risposta, think:[a,b]}
function setSteps(s){ST=s}
function render(t){const e0=ST.q;const pq=ease((t-e0)/0.5);$('q').style.opacity=pq;$('q').style.transform=`translateY(${14*(1-pq)}px)`;
 O.forEach((e,i)=>{const p=ease((t-ST.o[i]+0.1)/0.4);e.style.opacity=p;e.style.transform=`translateY(${14*(1-p)}px)`;
  const rv=t>=ST.r-0.2;e.classList.toggle('hl',!rv&&t>=ST.o[i]-0.1&&t<(ST.o[i+1]||ST.think[0])-0.1);
  e.classList.toggle('ok',rv&&i==D.ok);e.classList.toggle('no',rv&&i!=D.ok)});
 const th=ST.think;let w=0;if(t>=th[0]&&t<th[1])w=1-(t-th[0])/(th[1]-th[0]);$('bar').style.width=(1680*w)+'px';$('bar').style.opacity=w>0?1:0;
 const ps=ease((t-ST.r)/0.5);$('sp').style.opacity=ps;$('sp').style.transform=`translateY(${12*(1-ps)}px)`}
</script></body></html>
