<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
#k1{position:absolute;left:100px;top:110px;width:1100px;font:700 26px/1.3 FigB;letter-spacing:.12em;color:#2060AF;opacity:0}
#t1{position:absolute;left:96px;top:200px;font:400 140px Bri;opacity:0}
#s1{position:absolute;left:100px;top:380px;font:600 34px FigS;color:#2060AF;opacity:0}
#li{position:absolute;left:100px;top:470px;width:1050px}
#li div{font:400 38px/1.3 Fig;margin-bottom:14px;opacity:0}
#li b{font-family:FigB;color:#2060AF;margin-right:10px}
#fig{position:absolute;right:60px;top:120px;width:640px;height:800px;object-fit:contain;opacity:0}
#d{position:absolute;left:100px;top:395px;font:400 26px Fig;color:#0B1530;opacity:0}
</style></head><body><div id="k1"></div><div id="t1"></div><div id="s1"></div><div id="li"></div><img id="fig"><div class="foot" id="foot"></div>
<script>
const $=i=>document.getElementById(i),ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
let LI=[],ST=[];
function setData(d){$('k1').textContent=d.kicker;$('t1').textContent=d.titolo;$('s1').textContent=d.sub;$('foot').textContent=d.foot;$('li').innerHTML='';LI=[];
 d.voci.forEach((t,i)=>{const e=document.createElement('div');e.innerHTML='<b>'+(i+1)+'.</b>'+t;$('li').appendChild(e);LI.push(e)});
 if(d.img){$('fig').src=d.img;$('fig').style.display='block'}else $('fig').style.display='none'}
function setSteps(s){ST=s}
function render(t){const sh=(id,t0,d)=>{const e=$(id),p=ease((t-t0)/(d||0.6));e.style.opacity=p;e.style.transform=`translateY(${14*(1-p)}px)`};
 sh('k1',0.2);sh('t1',0.4,0.9);sh('s1',1.0);$('fig').style.opacity=ease((t-0.5)/1.4);
 LI.forEach((e,i)=>{const s=ST[i];if(!s)return;const p=ease((t-s[0]+0.1)/0.45);e.style.opacity=p;e.style.transform=`translateY(${14*(1-p)}px)`})}
</script></body></html>
