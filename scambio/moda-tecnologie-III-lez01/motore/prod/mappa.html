<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.n{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 18px;border-radius:16px;font:400 36px/1.22 Fig;color:#0B1530;opacity:0}
.n.hl{box-shadow:0 0 0 8px #FFE600}
.pes{background:#FFDCC6;border:5px solid #C2410C;font:400 54px/1.1 Bri}.pag{background:#FFF3BF;border:4px solid #A16207}
.men{background:#DDF3E4;border:4px solid #15803D}.cel{background:#DCEEFB;border:4px solid #1D4ED8}.lil{background:#EBDDF8;border:4px solid #7E22CE}
#tt{position:absolute;left:60px;top:98px;width:1300px;font:400 50px/1.1 Bri}
.leg{top:30px}
svg{position:absolute;left:0;top:0}
</style></head><body><div class="k" id="k"></div><div class="rule"></div>
<div class="leg"><span><i style="background:#FFDCC6;border-color:#C2410C"></i>concetto centrale</span><span><i style="background:#DCEEFB;border-color:#1D4ED8"></i>date e sequenze</span><span><i style="background:#FFF3BF;border-color:#A16207"></i>parole chiave</span><span><i style="background:#DDF3E4;border-color:#15803D"></i>esempi</span><span><i style="background:#EBDDF8;border-color:#7E22CE"></i>conseguenze</span></div>
<div id="tt"></div><svg width="1920" height="1080" id="sv"></svg><div id="nodes"></div>
<div class="foot" id="foot"></div>
<script>
const $=i=>document.getElementById(i),ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};
let NODES=[],LINES=[],STEPS=[],HOLD=4;
function fit(el,max,min){let s=max;el.style.fontSize=s+'px';while(el.scrollHeight>el.clientHeight+2&&s>min){s-=2;el.style.fontSize=s+'px'}}
function setData(d){
 $('k').textContent=d.kicker;$('tt').textContent=d.titolo;$('foot').textContent=d.foot;
 const rows=d.rami.reduce((a,r)=>a+Math.max(1,r.f.length),0);const top=210,bot=1030,rh=Math.min(200,(bot-top)/rows);
 $('nodes').innerHTML='';$('sv').innerHTML='';NODES=[];LINES=[];
 const mk=(t,c,x,y,w,h,big)=>{const e=document.createElement('div');e.className='n '+c;e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;e.innerHTML='<span>'+t+'</span>';$('nodes').appendChild(e);return e};
 const hasLeaf=d.rami.some(r=>r.f.length);
 const cx=60,cw=360,rx=hasLeaf?520:520,rw=hasLeaf?600:1300,fx=1180,fw=690;
 const ch=Math.min(240,rh*2);const midY=(top+bot)/2;
 const c0=mk(d.centro,'pes',cx,midY-ch/2,cw,ch);NODES.push(c0);
 let y=top;
 d.rami.forEach(r=>{const n=Math.max(1,r.f.length);const gy=y,gh=n*rh;const rbh=Math.min(gh-20,hasLeaf?rh*1.0*Math.max(1,n)-20:rh-20);
  const ry=gy+gh/2-rbh/2;const e=mk(r.t,r.c,rx,ry,rw,Math.min(rbh,hasLeaf?rh*Math.max(1,n)-20:rh-20));NODES.push(e);
  const li=addLine(cx+cw,midY,rx,ry+rbh/2);e._line=li;
  r.f.forEach((f,i)=>{const fy=gy+i*rh;const fe=mk(f.t,f.c,fx,fy+8,fw,rh-16);NODES.push(fe);fe._line=addLine(rx+rw,ry+rbh/2,fx,fy+rh/2)});
  y+=gh});
 NODES.forEach(e=>fit(e.firstChild?e:e,e.classList.contains('pes')?54:36,28))
 NODES.forEach(e=>{const s=e.firstChild;let sz=parseFloat(getComputedStyle(e).fontSize);while((s.offsetHeight>e.clientHeight-16||s.offsetWidth>e.clientWidth-30)&&sz>26){sz-=2;e.style.fontSize=sz+'px'}});
}
function addLine(x1,y1,x2,y2){const p=document.createElementNS('http://www.w3.org/2000/svg','path');const m=(x1+x2)/2;p.setAttribute('d',`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`);p.setAttribute('stroke','#0B1530');p.setAttribute('stroke-width','5');p.setAttribute('fill','none');p.style.opacity=0;$('sv').appendChild(p);return p}
function setSteps(s){STEPS=s}
function render(t){NODES.forEach((e,i)=>{const s=STEPS[i];if(!s){return}const p=ease((t-s[0]+0.15)/0.45);e.style.opacity=p;e.style.transform=`translateY(${14*(1-p)}px)`;
  if(e._line)e._line.style.opacity=ease((t-s[0]+0.55)/0.5);
  e.classList.toggle('hl',t>=s[0]-0.1&&t<s[0]+s[1]+0.25)})}
</script></body></html>
