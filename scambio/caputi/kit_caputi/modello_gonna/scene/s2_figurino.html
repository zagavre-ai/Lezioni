<div id="tt">Gonna base a tubo</div>

<img id="plat" src="plat.png"><div id="cap2">Il disegno tecnico (plat) della professoressa</div><div class="foot">LABORATORI TECNOLOGICI ED ESERCITAZIONE · Prof.ssa Piera Caputi</div><script>window.STEPS=[];function setSteps(s){window.STEPS=s}const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};function show(id,t0,t,d){const e=document.getElementById(id);const p=ease((t-t0)/(d||0.5));e.style.opacity=p;e.style.transform=`translateY(${16*(1-p)}px)`}function render(t){const s=STEPS[0]?STEPS[0][0]:1;document.getElementById('fig').style.opacity=ease((t-0.1)/1.0);show('cap1',0.6,t);show('tt',0.3,t);
show('c1',s+2.0,t);show('c2',s+5.9,t);document.getElementById('plat').style.opacity=ease((t-s-5.9)/0.6);show('cap2',s+6.3,t);
document.getElementById('c1').classList.toggle('on',t>s+2&&t<s+5.6);document.getElementById('c2').classList.toggle('on',t>s+5.9&&t<s+10);}</script></body></html>
