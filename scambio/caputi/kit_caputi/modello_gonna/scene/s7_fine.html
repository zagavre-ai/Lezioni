<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>#f{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
#a{font:400 70px Bri;opacity:0}#b{font:600 40px FigS;color:#2060AF;opacity:0}</style></head><body><div id="f"><div id="a">Ora torniamo dalla professoressa</div><div id="b">→ il tracciato del davanti</div></div><div class="foot">LABORATORI TECNOLOGICI ED ESERCITAZIONE · Prof.ssa Piera Caputi</div><script>window.STEPS=[];function setSteps(s){window.STEPS=s}const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};function show(id,t0,t,d){const e=document.getElementById(id);const p=ease((t-t0)/(d||0.5));e.style.opacity=p;e.style.transform=`translateY(${16*(1-p)}px)`}function render(t){show('a',0.3,t,0.7);show('b',1.2,t,0.7)}</script></body></html>
