<div id="sp">✓ <b style="font-family:FigB">58 cm</b>: UA × 3 − 5 cm = 63 − 5 = 58 cm</div><div class="foot">LABORATORI TECNOLOGICI ED ESERCITAZIONE · Prof.ssa Piera Caputi</div><script>window.STEPS=[];function setSteps(s){window.STEPS=s}const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};function show(id,t0,t,d){const e=document.getElementById(id);const p=ease((t-t0)/(d||0.5));e.style.opacity=p;e.style.transform=`translateY(${16*(1-p)}px)`}function render(t){const a=STEPS[0][0],b=STEPS[2]?STEPS[2][0]:99;show('q',a-0.4,t);['o1','o2','o3'].forEach((id,i)=>show(id,a+1.2+i*0.5,t));
