<img id="fig" src="figurino.png"><div class="foot">LABORATORI TECNOLOGICI ED ESERCITAZIONE · Prof.ssa Piera Caputi</div><script>window.STEPS=[];function setSteps(s){window.STEPS=s}const ease=x=>{x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)};function show(id,t0,t,d){const e=document.getElementById(id);const p=ease((t-t0)/(d||0.5));e.style.opacity=p;e.style.transform=`translateY(${16*(1-p)}px)`}function render(t){const s=STEPS[0]?STEPS[0][0]:1;show('t1',0.2,t,0.8);show('s1',0.8,t);document.getElementById('fig').style.opacity=ease((t-0.4)/1.2);
const s2=s+6.0;['l1','l2','l3','l4'].forEach((id,i)=>show(id,s2+i*0.9,t));}</script></body></html>
