SC.RF=()=>{const R=A.rf;

window.init=function(a){A=a;EL=[];$('tt').textContent=a.title;$('ey').textContent=a.ey||'Approfondimento';const st=$('stage');st.innerHTML='';
 (SC[a.scene||a.id])();
 EL.forEach((e,i)=>{const d=document.createElement('div');d.className='el';d.id='e'+i;d.style.cssText=`left:${e.x}px;top:${e.y}px;width:${e.w}px;z-index:${e.z}`;if(e.rot!=null){d.style.transformOrigin=e.origin;d.dataset.rot=e.rot}d.innerHTML=e.html;st.appendChild(d);e.node=d})};
window.draw=function(t){const P=A.P,k=(()=>{let k=-1;for(let i=0;i<P.length;i++)if(t>=P[i]-.05)k=i;return k})();let key=[k];
 const GLN=A.gl?Math.ceil(A.gl.length/3):0;
 EL.forEach(e=>{let a=P[Math.min(e.at,P.length-1)]+e.d;let v=E((t-a)/.6);
  if(e.hide!=null&&k>=e.hide){v*=1-E((t-(P[e.hide]-.3))/.4)}
  let dim=1;if(e.out!=null&&e.out<99&&k>e.out)dim=.16;
  if(e.grp!=null){v=(k>=e.at&&(e.out==99||k<e.out))?E((t-P[e.at])/.5):0;dim=1}
  const on=(k===e.at&&v>.3)||(e.on&&e.on.includes(k));
  const dy=(1-Math.min(1,v))*(e.grow?0:26);
  if(e.grow){e.node.style.transform=`rotate(${e.node.dataset.rot}deg) scaleX(${Math.min(1,v)})`}else e.node.style.transform=`translateY(${dy.toFixed(1)}px)`;
  e.node.style.opacity=(Math.min(1,Math.max(0,v))*dim).toFixed(2);e.node.classList.toggle('on',!!on);
  key.push(e.node.style.opacity,e.node.style.transform,on?1:0)});
 if(A.id=='RF'){document.querySelectorAll('[data-rt]').forEach((n,i)=>{const on=A.rf[i][2]<=k&&(A.rf[i][3]==null||k<A.rf[i][3]);n.style.borderColor=on?'#2060AF':'#D5DCE8';n.style.boxShadow=on?'0 0 0 5px #FFE600':'';key.push(on?1:0)})}
 const c=$('cap');const tx=(k>=0&&!A.nocap)?A.caps[k]:'';c.textContent=tx;c.style.opacity=tx?1:0;
 const fo=1-E((t-(A.dur-.5))/.5),fi=E(t/.5);document.body.style.opacity=Math.min(fi,fo).toFixed(2);key.push(document.body.style.opacity);
 return key.join('|')};
